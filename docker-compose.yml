version: "3.9"

services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4.1-mini

      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: https://cloud.langfuse.com

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"

    depends_on:
      - backend